<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1850" viewBox="0 0 1600 1850" role="img" aria-labelledby="title desc"><title id="title">Flujo de la aplicación Trainers Point</title><desc id="desc">La persona abre la web, se identifica y elige un apartado. Si no se identifica se solicita acceso. El servidor recibe la acción y comprueba permisos y datos. Si hay un problema pide corregirlo sin guardar cambios; si la operación es válida consulta o guarda en PostgreSQL y actualiza la pantalla. Cada paso indica las carpetas del código que participan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#789184" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="error" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b66b59" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="1850" fill="#f5f3ee"/><g font-family="Arial, Helvetica, sans-serif"><rect x="60" y="42" width="50" height="50" rx="12" fill="#f58329" stroke="none" stroke-width="1.6"/><text x="85" y="79" font-size="33" fill="#fff" font-weight="700" text-anchor="middle">T.</text><text x="130" y="67" font-size="20" fill="#243d31" font-weight="700" text-anchor="start">TRAINERS POINT · COBOSU</text><text x="130" y="94" font-size="19" fill="#65756b" font-weight="400" text-anchor="start">Diagrama de flujo · Qué ocurre y dónde está el código</text><text x="60" y="154" font-size="43" fill="#243d31" font-weight="700" text-anchor="start">Del clic del usuario al dato guardado</text><path d="M800 250 V285" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 375 V414" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M520 490 H420" fill="none" stroke="#b66b59" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#error)"/><path d="M240 450 V330 H520" fill="none" stroke="#b66b59" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#error)"/><path d="M800 566 V620" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 680 V712" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" /><path d="M300 712 H1300" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" /><path d="M300 712 V748" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 712 V748" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1300 712 V748" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 928 V958" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" /><path d="M800 928 V958" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" /><path d="M1300 928 V958" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" /><path d="M300 958 H1300" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" /><path d="M800 958 V995" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 1085 V1134" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1080 1210 H1165" fill="none" stroke="#b66b59" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#error)"/><path d="M1525 1210 H1560 V650 H1020" fill="none" stroke="#b66b59" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#error)"/><path d="M800 1286 V1340" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 1460 V1510" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 1630 V1650" fill="none" stroke="#789184" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="580" y="190" width="440" height="60" rx="30" fill="#253e33" stroke="none" stroke-width="1.6"/><text x="800" y="230" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">La persona abre la web</text><rect x="520" y="285" width="560" height="90" rx="16" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="800.0" y="323" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">Identificar al usuario</text><text x="800.0" y="355" font-size="19" fill="#67776d" font-weight="400" text-anchor="middle">web/auth/ + src/calendar/access.ts</text><path d="M800 414 L1080 490 L800 566 L520 490 Z" fill="#fff0dd" stroke="#e5ad70" stroke-width="1.8"/><text x="800" y="485" font-size="24" fill="#86501c" font-weight="700" text-anchor="middle">¿La sesión es válida?</text><text x="800" y="514" font-size="19" fill="#86501c" font-weight="400" text-anchor="middle">Comprobar el acceso</text><rect x="60" y="450" width="360" height="90" rx="16" fill="#fff2ec" stroke="#ddb2a2" stroke-width="1.6"/><text x="240.0" y="488" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">Solicitar acceso</text><text x="240.0" y="520" font-size="19" fill="#67776d" font-weight="400" text-anchor="middle">Volver a introducir los datos.</text><text x="467" y="474" font-size="21" fill="#ac6350" font-weight="700" text-anchor="middle">No</text><text x="830" y="598" font-size="21" fill="#4a785b" font-weight="700" text-anchor="middle">Sí</text><rect x="580" y="620" width="440" height="60" rx="16" fill="#e8efe8" stroke="#cedbce" stroke-width="1.6"/><text x="800" y="659" font-size="26" fill="#243d31" font-weight="700" text-anchor="middle">Elegir un apartado</text><rect x="60" y="748" width="480" height="180" rx="16" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="300" y="788" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">Agenda y equipo</text><text x="300" y="829" font-size="21" fill="#ab571c" font-weight="400" text-anchor="middle">web/calendar/ · web/staff/</text><text x="300" y="860" font-size="21" fill="#ab571c" font-weight="400" text-anchor="middle">web/planning/</text><text x="300" y="902" font-size="19" fill="#65756b" font-weight="400" text-anchor="middle">Reservas, turnos, fichajes y pendientes.</text><rect x="560" y="748" width="480" height="180" rx="16" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="800" y="788" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">Clientes, servicios y centros</text><text x="800" y="829" font-size="21" fill="#ab571c" font-weight="400" text-anchor="middle">web/clients/ · web/services/</text><text x="800" y="860" font-size="21" fill="#ab571c" font-weight="400" text-anchor="middle">web/centers/</text><text x="800" y="902" font-size="19" fill="#65756b" font-weight="400" text-anchor="middle">Fichas, servicios, bonos y gimnasios.</text><rect x="1060" y="748" width="480" height="180" rx="16" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="1300" y="788" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">Productos y caja</text><text x="1300" y="829" font-size="21" fill="#ab571c" font-weight="400" text-anchor="middle">web/inventory/</text><text x="1300" y="860" font-size="21" fill="#ab571c" font-weight="400" text-anchor="middle">web/cash/</text><text x="1300" y="902" font-size="19" fill="#65756b" font-weight="400" text-anchor="middle">Ventas, pagos, stock y caja diaria.</text><rect x="490" y="995" width="620" height="90" rx="16" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="800.0" y="1033" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">El servidor recibe la acción</text><text x="800.0" y="1065" font-size="19" fill="#67776d" font-weight="400" text-anchor="middle">src/index.ts → src/routes/ y src/calendar/http.ts</text><path d="M800 1134 L1080 1210 L800 1286 L520 1210 Z" fill="#fff0dd" stroke="#e5ad70" stroke-width="1.8"/><text x="800" y="1205" font-size="24" fill="#86501c" font-weight="700" text-anchor="middle">¿Se puede realizar?</text><text x="800" y="1234" font-size="19" fill="#86501c" font-weight="400" text-anchor="middle">Permisos, datos y reglas del negocio</text><rect x="1165" y="1155" width="360" height="110" rx="16" fill="#fff2ec" stroke="#ddb2a2" stroke-width="1.6"/><text x="1345" y="1190" font-size="24" fill="#8f5040" font-weight="700" text-anchor="middle">Indicar qué corregir</text><text x="1345" y="1222" font-size="20" fill="#8f5040" font-weight="400" text-anchor="middle">La operación no se guarda.</text><text x="1345" y="1248" font-size="18" fill="#8f5040" font-weight="400" text-anchor="middle">Corregir y volver a intentar.</text><text x="1122" y="1192" font-size="21" fill="#ac6350" font-weight="700" text-anchor="middle">No</text><text x="830" y="1320" font-size="21" fill="#4a785b" font-weight="700" text-anchor="middle">Sí</text><rect x="60" y="1143" width="365" height="137" rx="16" fill="#ecefe8" stroke="none" stroke-width="1.6"/><text x="83" y="1176" font-size="20" fill="#243d31" font-weight="700" text-anchor="start">Se comprueba, por ejemplo:</text><text x="83" y="1209" font-size="20" fill="#65756b" font-weight="400" text-anchor="start">Horario libre, stock e importe.</text><text x="83" y="1238" font-size="19" fill="#65756b" font-weight="400" text-anchor="start">src/calendar/ · src/finance/</text><text x="83" y="1264" font-size="19" fill="#65756b" font-weight="400" text-anchor="start">src/validation/ · src/http/</text><path d="M510 1364 A290 24 0 0 1 1090 1364 L1090 1436 A290 24 0 0 1 510 1436 Z" fill="#e4eee3" stroke="#9eb59f" stroke-width="1.8"/><ellipse cx="800" cy="1364" rx="290" ry="24" fill="#eff5eb" stroke="#9eb59f" stroke-width="1.8"/><text x="800" y="1415" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">Consultar o guardar en PostgreSQL</text><text x="800" y="1445" font-size="20" fill="#52715a" font-weight="400" text-anchor="middle">Prisma + pg · Una base de datos compartida</text><rect x="490" y="1510" width="620" height="120" rx="16" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="800.0" y="1548" font-size="25" fill="#243d31" font-weight="700" text-anchor="middle">El servidor responde y la pantalla se actualiza</text><text x="800.0" y="1580" font-size="19" fill="#67776d" font-weight="400" text-anchor="middle">JavaScript de cada pantalla en web/</text><text x="800" y="1606" font-size="18" fill="#67776d" font-weight="400" text-anchor="middle">Calendarios: web/shared/polling.js consulta los cambios.</text><rect x="580" y="1650" width="440" height="56" rx="28" fill="#253e33" stroke="none" stroke-width="1.6"/><text x="800" y="1687" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">Resultado visible para el usuario</text><rect x="60" y="1743" width="1480" height="72" rx="14" fill="#fff" stroke="#d8e0d8" stroke-width="1.6"/><text x="84" y="1772" font-size="16" fill="#a45a24" font-weight="700" text-anchor="start">DISEÑO COMÚN</text><text x="84" y="1799" font-size="19" fill="#637168" font-weight="400" text-anchor="start">web/shared/ → menú, estilos, márgenes y ayuda</text><text x="865" y="1772" font-size="16" fill="#a45a24" font-weight="700" text-anchor="start">ESTRUCTURA DE LOS DATOS</text><text x="865" y="1799" font-size="19" fill="#637168" font-weight="400" text-anchor="start">prisma/schema.prisma + tablas de src/calendar/</text></g></svg>