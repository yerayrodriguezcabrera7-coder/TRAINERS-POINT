<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1940" viewBox="0 0 1800 1940" role="img" aria-labelledby="title desc"><title id="title">Mapa del código de Trainers Point</title><desc id="desc">Las pantallas están en web; las reglas y el servidor en src; el modelo de datos en prisma; imágenes y fuentes en public/assets. También se muestran scripts, pruebas, despliegue, documentación, archivos de configuración y accesos a los archivos de márgenes, menú y calendario.</desc><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#193a2d" flood-opacity=".05"/></filter></defs><rect width="1800" height="1940" fill="#f5f3ee"/><g font-family="Arial, Helvetica, sans-serif"><rect x="60" y="42" width="52" height="52" rx="12" fill="#f58329" stroke="none" /><text x="73" y="81" font-size="34" fill="#fff" font-weight="700" >T.</text><text x="130" y="67" font-size="21" fill="#23342f" font-weight="700" letter-spacing="1.4">TRAINERS POINT</text><text x="130" y="93" font-size="19" fill="#68736d" font-weight="400" >COBOSU · Guía para encontrar cada archivo</text><text x="60" y="156" font-size="48" fill="#23342f" font-weight="700" letter-spacing="-1.1">Dónde está cada parte del código</text><text x="60" y="194" font-size="23" fill="#5e6c65" font-weight="400" >Abre TRAINERS-POINT en VS Code. Esta es la organización actual del proyecto local.</text><rect x="630" y="218" width="540" height="54" rx="12" fill="#253e33" stroke="none" /><text x="900" y="253" font-size="24" fill="#fff" font-weight="700" text-anchor="middle" font-family="Menlo, Consolas, monospace">TRAINERS-POINT /</text><line x1="900" y1="272" x2="900" y2="289" stroke="#9cae9f" stroke-width="2"/><line x1="465" y1="289" x2="1335" y2="289" stroke="#9cae9f" stroke-width="2"/><line x1="465" y1="289" x2="465" y2="308" stroke="#9cae9f" stroke-width="2"/><line x1="1335" y1="289" x2="1335" y2="308" stroke="#9cae9f" stroke-width="2"/><rect x="60" y="308" width="810" height="873" rx="18" fill="#fff" stroke="#dce2da" filter="url(#shadow)"/><text x="86" y="351" font-size="27" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">web/</text><text x="86" y="384" font-size="20" fill="#61716a" font-weight="400" >Lo que ves y utilizas en el navegador</text><text x="88" y="430" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">calendar/</text><text x="88" y="459" font-size="19" fill="#5d6d64" font-weight="400" >Calendario: index.html, app.js, styles.css y calendar-core.js</text><line x1="88" y1="475" x2="842" y2="475" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="495" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">clients/</text><text x="88" y="524" font-size="19" fill="#5d6d64" font-weight="400" >Clientes y fichas: clients.* y client-profile.*</text><line x1="88" y1="540" x2="842" y2="540" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="560" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">services/</text><text x="88" y="589" font-size="19" fill="#5d6d64" font-weight="400" >Servicios: services.html, services.css y services.js</text><line x1="88" y1="605" x2="842" y2="605" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="625" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">staff/</text><text x="88" y="654" font-size="19" fill="#5d6d64" font-weight="400" >Profesionales, usuarios, fichajes, ausencias y gestión de turnos</text><line x1="88" y1="670" x2="842" y2="670" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="690" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">centers/</text><text x="88" y="719" font-size="19" fill="#5d6d64" font-weight="400" >Centros o gimnasios: gyms.html, gyms.css y gyms.js</text><line x1="88" y1="735" x2="842" y2="735" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="755" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">inventory/</text><text x="88" y="784" font-size="19" fill="#5d6d64" font-weight="400" >Productos, ventas y pagos: productos.html, .css y .js</text><line x1="88" y1="800" x2="842" y2="800" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="820" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">cash/</text><text x="88" y="849" font-size="19" fill="#5d6d64" font-weight="400" >Apertura, movimientos y cierre de caja: caja.html, .css y .js</text><line x1="88" y1="865" x2="842" y2="865" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="885" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">planning/</text><text x="88" y="914" font-size="19" fill="#5d6d64" font-weight="400" >Pendientes, recuperaciones y reservas del cliente</text><line x1="88" y1="930" x2="842" y2="930" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="950" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">dashboard/</text><text x="88" y="979" font-size="19" fill="#5d6d64" font-weight="400" >Pantalla de inicio: inicio.html, inicio.css e inicio.js</text><line x1="88" y1="995" x2="842" y2="995" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="1015" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">auth/</text><text x="88" y="1044" font-size="19" fill="#5d6d64" font-weight="400" >Acceso y cambio de contraseña: login.* y change-password.*</text><line x1="88" y1="1060" x2="842" y2="1060" stroke="#ebeee7" stroke-width="1.5"/><text x="88" y="1080" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">shared/</text><text x="88" y="1109" font-size="19" fill="#5d6d64" font-weight="400" >Menú, diseño, márgenes, ayuda y actualización automática</text><rect x="86" y="1135" width="758" height="29" rx="7" fill="#f7f1e9" stroke="none" /><text x="102" y="1156" font-size="18" fill="#896344" font-weight="400" >HTML = contenido   ·   CSS = aspecto   ·   JavaScript = interacción</text><rect x="930" y="308" width="810" height="873" rx="18" fill="#fff" stroke="#dce2da" filter="url(#shadow)"/><text x="956" y="351" font-size="27" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">src/</text><text x="956" y="384" font-size="20" fill="#61716a" font-weight="400" >El servidor: comprueba y guarda las operaciones</text><text x="958" y="430" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">index.ts</text><text x="958" y="459" font-size="19" fill="#5d6d64" font-weight="400" >Arranca la aplicación y coordina las peticiones.</text><line x1="958" y1="475" x2="1712" y2="475" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="495" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">routes/</text><text x="958" y="524" font-size="19" fill="#5d6d64" font-weight="400" >Entradas de clientes, servicios, centros, bonos y finanzas.</text><line x1="958" y1="540" x2="1712" y2="540" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="560" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">calendar/</text><text x="958" y="589" font-size="19" fill="#5d6d64" font-weight="400" >Reservas, horarios, ausencias, fichajes, acceso y permisos.</text><text x="980" y="612" font-size="18" fill="#7b877e" font-weight="400" >http.ts · store.ts · model.ts · access.ts</text><line x1="958" y1="630" x2="1712" y2="630" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="666" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">finance/</text><text x="958" y="695" font-size="19" fill="#5d6d64" font-weight="400" >Productos y ventas, caja, bonos y saldos pendientes.</text><text x="980" y="718" font-size="18" fill="#7b877e" font-weight="400" >inventory.ts · cash.ts · packages.ts · debts.ts</text><text x="980" y="746" font-size="18" fill="#7b877e" font-weight="400" >money.ts · transaction.ts: importes y operaciones coordinadas</text><line x1="958" y1="764" x2="1712" y2="764" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="804" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">http/</text><text x="958" y="833" font-size="19" fill="#5d6d64" font-weight="400" >Permisos comunes, respuestas y entrega de archivos de la web.</text><line x1="958" y1="849" x2="1712" y2="849" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="869" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">validation/records.ts</text><text x="958" y="898" font-size="19" fill="#5d6d64" font-weight="400" >Comprueba que los datos introducidos sean válidos.</text><line x1="958" y1="914" x2="1712" y2="914" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="934" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">lib/prisma.ts</text><text x="958" y="963" font-size="19" fill="#5d6d64" font-weight="400" >Conexión compartida con la base de datos.</text><line x1="958" y1="979" x2="1712" y2="979" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="999" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">runtime-config.ts</text><text x="958" y="1028" font-size="19" fill="#5d6d64" font-weight="400" >Ajustes de arranque en local y en producción.</text><line x1="958" y1="1044" x2="1712" y2="1044" stroke="#ebeee7" stroke-width="1.5"/><text x="958" y="1064" font-size="21" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">progress-migration.ts · test-db.ts</text><text x="958" y="1093" font-size="19" fill="#5d6d64" font-weight="400" >Preparación de datos de progreso y comprobación de conexión.</text><rect x="956" y="1135" width="758" height="29" rx="7" fill="#eef3ed" stroke="none" /><text x="972" y="1156" font-size="18" fill="#4a6c55" font-weight="400" >TypeScript (.ts) = código de las reglas y del servidor</text><rect x="60" y="1207" width="544" height="220" rx="18" fill="#fff" stroke="#dce2da" /><text x="84" y="1246" font-size="22" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">prisma/</text><text x="84" y="1285" font-size="19" fill="#5d6d64" font-weight="400" >schema.prisma: estructura de los datos.</text><text x="84" y="1315" font-size="19" fill="#5d6d64" font-weight="400" >migrations/: historial de cambios de tablas.</text><text x="84" y="1345" font-size="19" fill="#5d6d64" font-weight="400" >El calendario también define tablas en</text><text x="84" y="1375" font-size="19" fill="#5d6d64" font-weight="400" >src/calendar/. Los datos viven en PostgreSQL.</text><rect x="628" y="1207" width="544" height="220" rx="18" fill="#fff" stroke="#dce2da" /><text x="652" y="1246" font-size="22" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">public/assets/</text><text x="652" y="1285" font-size="19" fill="#5d6d64" font-weight="400" >Logotipos de Trainers Point y COBOSU.</text><text x="652" y="1315" font-size="19" fill="#5d6d64" font-weight="400" >fonts/: fuentes utilizadas por la web.</text><text x="652" y="1345" font-size="19" fill="#5d6d64" font-weight="400" >Contiene recursos visuales.</text><text x="652" y="1375" font-size="19" fill="#5d6d64" font-weight="400" >Las pantallas están en web/.</text><rect x="1196" y="1207" width="544" height="220" rx="18" fill="#fff" stroke="#dce2da" /><text x="1220" y="1246" font-size="22" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">scripts/</text><text x="1220" y="1285" font-size="19" fill="#5d6d64" font-weight="400" >build.cjs: prepara la aplicación para ejecutar.</text><text x="1220" y="1315" font-size="19" fill="#5d6d64" font-weight="400" >ensure-local-db.cjs: prepara la base local.</text><text x="1220" y="1345" font-size="19" fill="#5d6d64" font-weight="400" >create-admin.cjs y demo.cjs: utilidades.</text><text x="1220" y="1375" font-size="19" fill="#5d6d64" font-weight="400" >database-backup.cjs: copias y recuperación.</text><rect x="60" y="1451" width="544" height="220" rx="18" fill="#fff" stroke="#dce2da" /><text x="84" y="1490" font-size="22" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">tests/ + .github/workflows/</text><text x="84" y="1529" font-size="19" fill="#5d6d64" font-weight="400" >tests/: comprueba reservas, permisos,</text><text x="84" y="1559" font-size="19" fill="#5d6d64" font-weight="400" >productos, caja, diseño y funcionamiento.</text><text x="84" y="1589" font-size="19" fill="#5d6d64" font-weight="400" >tests.yml: comprobaciones en GitHub.</text><text x="84" y="1619" font-size="19" fill="#5d6d64" font-weight="400" >calendar-core.test.cjs también está en web/.</text><rect x="628" y="1451" width="544" height="220" rx="18" fill="#fff" stroke="#dce2da" /><text x="652" y="1490" font-size="22" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">deploy/ + Dockerfile</text><text x="652" y="1529" font-size="19" fill="#5d6d64" font-weight="400" >compose.yaml: servicios de la instalación.</text><text x="652" y="1559" font-size="19" fill="#5d6d64" font-weight="400" >Caddyfile: acceso mediante HTTPS.</text><text x="652" y="1589" font-size="19" fill="#5d6d64" font-weight="400" >backup-loop.sh: copias periódicas.</text><text x="652" y="1619" font-size="19" fill="#5d6d64" font-weight="400" >Preparado para publicar; aún sin activar.</text><rect x="1196" y="1451" width="544" height="220" rx="18" fill="#fff" stroke="#dce2da" /><text x="1220" y="1490" font-size="22" fill="#b85919" font-weight="600" font-family="Menlo, Consolas, monospace">Documentación y ajustes</text><text x="1220" y="1529" font-size="19" fill="#5d6d64" font-weight="400" >docs/ y README.md: guías y explicaciones.</text><text x="1220" y="1559" font-size="19" fill="#5d6d64" font-weight="400" >package.json: comandos y dependencias.</text><text x="1220" y="1589" font-size="19" fill="#5d6d64" font-weight="400" >tsconfig.json y .vscode/: ajustes de trabajo.</text><text x="1220" y="1619" font-size="19" fill="#5d6d64" font-weight="400" >.env: configuración local; no se comparte.</text><rect x="60" y="1700" width="1680" height="132" rx="18" fill="#253e33" stroke="none" /><text x="84" y="1735" font-size="17" fill="#c8dbcd" font-weight="700" letter-spacing="1">PARA LOS CAMBIOS MÁS HABITUALES</text><text x="84" y="1771" font-size="23" fill="#fff" font-weight="700" >Márgenes y separación</text><text x="84" y="1805" font-size="20" fill="#d4e4d8" font-weight="400" >web/shared/orden.css</text><text x="645" y="1771" font-size="23" fill="#fff" font-weight="700" >Menú lateral</text><text x="645" y="1805" font-size="20" fill="#d4e4d8" font-weight="400" >web/shared/menu.js y menu.css</text><text x="1205" y="1771" font-size="23" fill="#fff" font-weight="700" >Calendario</text><text x="1205" y="1805" font-size="20" fill="#d4e4d8" font-weight="400" >web/calendar/app.js y styles.css</text><text x="60" y="1873" font-size="20" fill="#637168" font-weight="400" >Carpetas automáticas: dist/ = código compilado · node_modules/ = librerías · .calendar-dev/ = base local persistente.</text><text x="60" y="1906" font-size="19" fill="#637168" font-weight="400" >Trabaja en web/ y src/. VS Code oculta esas tres carpetas automáticas; .calendar-dev/ conserva tus datos, no la borres.</text></g></svg>