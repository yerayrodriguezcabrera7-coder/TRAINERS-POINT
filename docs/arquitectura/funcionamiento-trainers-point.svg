<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img" aria-labelledby="title desc">
<title id="title">Cómo funciona Trainers Point: web, servidor y base de datos compartida</title>
<desc id="desc">Administración, recepción, trabajadores y clientes acceden a una misma web con diferentes permisos. La web consulta una API propia en Node.js y TypeScript, que valida las operaciones y guarda los datos en PostgreSQL. El calendario consulta los cambios aproximadamente cada dos segundos mientras está visible. La aplicación funciona localmente. El despliegue con dominio, HTTPS, Caddy, Docker y copias diarias está preparado, pero no activado.</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1,1 L6,4 L1,7" fill="none" stroke="#87938f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172c27" flood-opacity=".055"/></filter>
</defs>
<rect width="1800" height="1510" fill="#f5f3ee"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="60" y="49" width="53" height="53" rx="12" fill="#f58329" stroke="none" /><text x="74" y="88" font-size="34" fill="#fff" font-weight="700" >T.</text><text x="131" y="75" font-size="21" fill="#23342f" font-weight="700" letter-spacing="1.5">TRAINERS POINT</text><text x="131" y="100" font-size="19" fill="#68736d" font-weight="400" >COBOSU · Arquitectura de la web</text><rect x="1406" y="60" width="334" height="34" rx="9" fill="#e5ebe6" stroke="none" /><text x="1573.0" y="83" font-size="17" fill="#355c4e" font-weight="600" text-anchor="middle">MAPA DEL CÓDIGO ACTUAL</text><text x="60" y="169" font-size="52" fill="#23342f" font-weight="700" letter-spacing="-1.5">Así funciona la página web</text><text x="60" y="207" font-size="24" fill="#5e6c65" font-weight="400" >Una aplicación compartida. Cada persona ve y gestiona lo que le corresponde.</text><rect x="60" y="252" width="520" height="602" rx="20" fill="#ffffff" stroke="#dce2da" filter="url(#shadow)"/><rect x="88" y="277" width="45" height="34" rx="9" fill="#fff0df" stroke="none" /><text x="110.5" y="300" font-size="18" fill="#a84b0e" font-weight="600" text-anchor="middle">01</text><text x="147" y="300" font-size="16" fill="#61716a" font-weight="700" letter-spacing="1">LO QUE VE CADA PERSONA</text><rect x="640" y="252" width="520" height="602" rx="20" fill="#ffffff" stroke="#dce2da" filter="url(#shadow)"/><rect x="668" y="277" width="45" height="34" rx="9" fill="#fff0df" stroke="none" /><text x="690.5" y="300" font-size="18" fill="#a84b0e" font-weight="600" text-anchor="middle">02</text><text x="727" y="300" font-size="16" fill="#61716a" font-weight="700" letter-spacing="1">DONDE SE COMPRUEBA TODO</text><rect x="1220" y="252" width="520" height="602" rx="20" fill="#ffffff" stroke="#dce2da" filter="url(#shadow)"/><rect x="1248" y="277" width="45" height="34" rx="9" fill="#fff0df" stroke="none" /><text x="1270.5" y="300" font-size="18" fill="#a84b0e" font-weight="600" text-anchor="middle">03</text><text x="1307" y="300" font-size="16" fill="#61716a" font-weight="700" letter-spacing="1">DONDE SE GUARDA TODO</text><text x="88" y="352" font-size="33" fill="#23342f" font-weight="700" >Página web</text><text x="88" y="382" font-size="20" fill="#61716a" font-weight="400" >Se abre en el navegador</text><rect x="499" y="330" width="49" height="35" rx="5" fill="none" stroke="#dc7a30" /><line x1="500" y1="341" x2="547" y2="341" stroke="#dc7a30" stroke-width="1.5" /><circle cx="506" cy="336" r="1.5" fill="#dc7a30"/><circle cx="512" cy="336" r="1.5" fill="#dc7a30"/><circle cx="518" cy="336" r="1.5" fill="#dc7a30"/><rect x="88" y="411" width="464" height="57" rx="10" fill="#f7f8f4" stroke="none" /><text x="104" y="433" font-size="20" fill="#23342f" font-weight="700" >Administración</text><text x="104" y="456" font-size="18" fill="#63706b" font-weight="400" >Configura y supervisa el centro.</text><rect x="88" y="477" width="464" height="57" rx="10" fill="#f7f8f4" stroke="none" /><text x="104" y="499" font-size="20" fill="#23342f" font-weight="700" >Recepción</text><text x="104" y="522" font-size="18" fill="#63706b" font-weight="400" >Organiza citas, ventas y caja.</text><rect x="88" y="543" width="464" height="57" rx="10" fill="#f7f8f4" stroke="none" /><text x="104" y="565" font-size="20" fill="#23342f" font-weight="700" >Trabajador</text><text x="104" y="588" font-size="18" fill="#63706b" font-weight="400" >Consulta su agenda y sus fichajes.</text><rect x="88" y="609" width="464" height="57" rx="10" fill="#f7f8f4" stroke="none" /><text x="104" y="631" font-size="20" fill="#23342f" font-weight="700" >Cliente con acceso</text><text x="104" y="654" font-size="18" fill="#63706b" font-weight="400" >Consulta sus propias reservas.</text><line x1="88" y1="692" x2="552" y2="692" stroke="#dfE3dd" stroke-width="1.5" /><text x="88" y="722" font-size="20" fill="#23342f" font-weight="700" >Apartados conectados</text><text x="88" y="752" font-size="19" fill="#63706b" font-weight="400" >Calendario · Clientes · Servicios · Equipo</text><text x="88" y="780" font-size="19" fill="#63706b" font-weight="400" >Productos · Ventas · Caja · Centros</text><text x="88" y="824" font-size="17" fill="#7c8780" font-weight="400" >HTML + CSS + JavaScript  ·  carpeta web/</text><text x="668" y="352" font-size="30" fill="#23342f" font-weight="700" >Servidor de la aplicación</text><text x="668" y="382" font-size="20" fill="#61716a" font-weight="400" >Node.js + TypeScript</text><rect x="668" y="411" width="464" height="68" rx="12" fill="#fff1e3" stroke="none" /><text x="686" y="439" font-size="22" fill="#a84b0e" font-weight="700" >API propia</text><text x="686" y="465" font-size="18" fill="#815b3e" font-weight="400" >Conecta la pantalla con la lógica del negocio.</text><circle cx="675" cy="511" r="4" fill="#ed7b28"/><text x="692" y="518" font-size="22" fill="#23342f" font-weight="700" >Acceso y permisos</text><text x="692" y="546" font-size="19" fill="#63706b" font-weight="400" >Comprueba quién entra y qué puede hacer.</text><circle cx="675" cy="579" r="4" fill="#ed7b28"/><text x="692" y="586" font-size="22" fill="#23342f" font-weight="700" >Reservas y disponibilidad</text><text x="692" y="614" font-size="19" fill="#63706b" font-weight="400" >Revisa horarios, ausencias y solapamientos.</text><circle cx="675" cy="647" r="4" fill="#ed7b28"/><text x="692" y="654" font-size="22" fill="#23342f" font-weight="700" >Ventas, deudas y caja</text><text x="692" y="682" font-size="19" fill="#63706b" font-weight="400" >Valida importes, stock y pagos registrados.</text><circle cx="675" cy="715" r="4" fill="#ed7b28"/><text x="692" y="722" font-size="22" fill="#23342f" font-weight="700" >Operaciones coordinadas</text><text x="692" y="750" font-size="19" fill="#63706b" font-weight="400" >Usa transacciones y bloqueos para evitar</text><text x="692" y="775" font-size="19" fill="#63706b" font-weight="400" >conflictos cuando coinciden varias acciones.</text><text x="668" y="824" font-size="17" fill="#7c8780" font-weight="400" >Lógica y reglas  ·  carpeta src/</text><text x="1248" y="352" font-size="30" fill="#23342f" font-weight="700" >Base de datos compartida</text><text x="1248" y="382" font-size="20" fill="#61716a" font-weight="400" >PostgreSQL</text><rect x="1248" y="411" width="464" height="68" rx="12" fill="#eaf2ec" stroke="none" /><text x="1266" y="439" font-size="22" fill="#2c634b" font-weight="700" >La información se conserva</text><text x="1266" y="465" font-size="19" fill="#4e6d5c" font-weight="400" >Aunque cierres la página o el navegador.</text><circle cx="1255" cy="511" r="4" fill="#ed7b28"/><text x="1272" y="518" font-size="22" fill="#23342f" font-weight="700" >Personas y centros</text><text x="1272" y="546" font-size="19" fill="#63706b" font-weight="400" >Clientes, empleados, usuarios y permisos.</text><circle cx="1255" cy="579" r="4" fill="#ed7b28"/><text x="1272" y="586" font-size="22" fill="#23342f" font-weight="700" >Agenda y equipo</text><text x="1272" y="614" font-size="19" fill="#63706b" font-weight="400" >Reservas, servicios, horarios y ausencias.</text><circle cx="1255" cy="647" r="4" fill="#ed7b28"/><text x="1272" y="654" font-size="22" fill="#23342f" font-weight="700" >Gestión económica</text><text x="1272" y="682" font-size="19" fill="#63706b" font-weight="400" >Productos, ventas, pagos, bonos y caja.</text><circle cx="1255" cy="715" r="4" fill="#ed7b28"/><text x="1272" y="722" font-size="22" fill="#23342f" font-weight="700" >Acceso desde el servidor</text><text x="1272" y="750" font-size="19" fill="#63706b" font-weight="400" >Prisma + consultas PostgreSQL (pg).</text><text x="1272" y="775" font-size="19" fill="#63706b" font-weight="400" >El navegador no accede directamente.</text><text x="1248" y="824" font-size="17" fill="#7c8780" font-weight="400" >Modelo de datos  ·  prisma/ y src/calendar/</text><line x1="589" y1="515" x2="631" y2="515" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><line x1="631" y1="557" x2="589" y2="557" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><line x1="1169" y1="515" x2="1211" y2="515" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><line x1="1211" y1="557" x2="1169" y2="557" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="878" width="1680" height="80" rx="17" fill="#253e33" stroke="none" /><circle cx="95" cy="918" r="7" fill="#f89a53"/><text x="117" y="911" font-size="23" fill="#fff" font-weight="700" >Las agendas comparten las mismas reservas</text><text x="117" y="939" font-size="21" fill="#d5e3da" font-weight="400" >La pantalla consulta cambios cada ≈2 s mientras está visible; muestra solo los datos permitidos para cada usuario.</text><text x="60" y="1008" font-size="17" fill="#61716a" font-weight="700" letter-spacing="1.2">EJEMPLO · QUÉ PASA AL CREAR UNA CITA</text><rect x="60" y="1030" width="390" height="114" rx="15" fill="#fff" stroke="#dce2da" /><text x="79" y="1062" font-size="18" fill="#c5681d" font-weight="700" >1</text><text x="107" y="1062" font-size="21" fill="#23342f" font-weight="700" >Recepción crea la cita</text><text x="79" y="1101" font-size="19" fill="#63706b" font-weight="400" >Elige cliente, servicio y horario.</text><rect x="490" y="1030" width="390" height="114" rx="15" fill="#fff" stroke="#dce2da" /><text x="509" y="1062" font-size="18" fill="#c5681d" font-weight="700" >2</text><text x="537" y="1062" font-size="21" fill="#23342f" font-weight="700" >Se revisa el hueco</text><text x="509" y="1101" font-size="19" fill="#63706b" font-weight="400" >Se comprueba la disponibilidad.</text><rect x="920" y="1030" width="390" height="114" rx="15" fill="#fff" stroke="#dce2da" /><text x="939" y="1062" font-size="18" fill="#c5681d" font-weight="700" >3</text><text x="967" y="1062" font-size="21" fill="#23342f" font-weight="700" >Se guarda la reserva</text><text x="939" y="1101" font-size="19" fill="#63706b" font-weight="400" >Queda vinculada al trabajador.</text><rect x="1350" y="1030" width="390" height="114" rx="15" fill="#fff" stroke="#dce2da" /><text x="1369" y="1062" font-size="18" fill="#c5681d" font-weight="700" >4</text><text x="1397" y="1062" font-size="21" fill="#23342f" font-weight="700" >Las agendas se actualizan</text><text x="1369" y="1101" font-size="19" fill="#63706b" font-weight="400" >Cada perfil ve lo que le corresponde.</text><line x1="457" y1="1087" x2="482" y2="1087" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><line x1="887" y1="1087" x2="912" y2="1087" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><line x1="1317" y1="1087" x2="1342" y2="1087" stroke="#87938f" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1180" width="624" height="204" rx="18" fill="#e9eee8" stroke="#cfd8ce" /><rect x="82" y="1200" width="234" height="34" rx="9" fill="#d4e3d6" stroke="none" /><text x="199.0" y="1223" font-size="16" fill="#2c634b" font-weight="600" text-anchor="middle">AHORA · EN LOCAL</text><text x="82" y="1261" font-size="28" fill="#23342f" font-weight="700" >En tu ordenador</text><text x="82" y="1295" font-size="21" fill="#53665b" font-weight="400" >Navegador → aplicación → PostgreSQL local</text><text x="82" y="1331" font-size="23" fill="#2f654c" font-weight="700" >localhost:3000</text><text x="82" y="1361" font-size="17" fill="#63776b" font-weight="400" >Los datos locales permanecen en .calendar-dev/</text><rect x="708" y="1180" width="1032" height="204" rx="18" fill="#fcfbf7" stroke="#c7bca9" stroke-dasharray="7 5"/><rect x="730" y="1200" width="430" height="34" rx="9" fill="#f1e9dc" stroke="none" /><text x="945.0" y="1223" font-size="16" fill="#7b6242" font-weight="600" text-anchor="middle">PREPARADO · PENDIENTE DE PUBLICAR</text><text x="730" y="1261" font-size="28" fill="#23342f" font-weight="700" >Para utilizarla desde la empresa</text><text x="730" y="1295" font-size="22" fill="#53665b" font-weight="400" >Dominio HTTPS → Caddy → aplicación → PostgreSQL privado</text><text x="730" y="1331" font-size="21" fill="#53665b" font-weight="400" >Docker Compose incluye copias diarias al desplegar.</text><text x="730" y="1361" font-size="18" fill="#776b59" font-weight="400" >Falta configurar servidor, dominio y una copia adicional fuera del servidor.</text><line x1="60" y1="1415" x2="1740" y2="1415" stroke="#d6ddd4" stroke-width="1.5" /><text x="60" y="1447" font-size="20" fill="#67746b" font-weight="400" >Aún sin conectar: pagos online, correo y WhatsApp. Los pagos actuales se registran manualmente.</text><text x="60" y="1478" font-size="17" fill="#7f877f" font-weight="400" >GitHub guarda el código; el servidor ejecuta la web.  ·  Esquema del proyecto local, sin contratar ni activar servicios.</text></g></svg>