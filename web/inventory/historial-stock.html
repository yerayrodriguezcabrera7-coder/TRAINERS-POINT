<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial de Stock · Trainers Point</title>
<script src="/runtime.js" defer></script><script src="/menu.js" defer></script><script src="/historial-stock.js" defer></script>
<link rel="stylesheet" href="/fichajes.css"><link rel="stylesheet" href="/gestion.css"><link rel="stylesheet" href="/menu.css"><link rel="stylesheet" href="/design.css"><link rel="stylesheet" href="/historial-stock.css"><link rel="stylesheet" href="/orden.css"><link rel="stylesheet" href="/ayuda.css"><script src="/ayuda.js" defer></script></head>
<body><div class="app-shell"><aside data-app-menu aria-label="Navegación"></aside><main class="attendance-shell main-content"><header class="topbar"><div class="breadcrumb"><span>Ventas y caja</span><span class="crumb-separator">/</span><strong>Historial de Stock</strong></div></header><section class="page-content">
<header class="attendance-header"><div><p class="eyebrow">CATÁLOGO E INVENTARIO</p><h1>Historial de Stock<span class="accent">.</span></h1><p>Registro completo de todas las entradas y salidas de existencias.</p></div><button id="new-stock-loss" type="button" class="primary" hidden>Registrar merma / salida</button></header><p id="notice" role="status"></p>
<section id="stats" class="product-stock-alert" aria-label="Resumen de movimientos" aria-live="polite"></section>
<section class="attendance-card management-card" aria-label="Historial de movimientos de stock"><div class="panel-toolbar">
<label class="product-search">Buscar producto, nota o referencia<input id="search" type="search" placeholder="Nombre, nota o referencia" autocomplete="off"></label>
<div class="filter-group"><label for="filter-type">Tipo:</label><select id="filter-type"><option value="ALL">Todos</option><option value="ENTRADA">Entrada</option><option value="VENTA">Venta</option><option value="DEVOLUCION">Devolución</option><option value="AJUSTE">Ajuste</option><option value="DANO">Daño</option><option value="SALIDA">Salida</option></select></div>
<label class="filter-group"><label for="filter-product">Producto:</label><select id="filter-product"><option value="ALL">Todos</option></select></label>
<div class="filter-group"><label for="filter-from">Desde:</label><input id="filter-from" type="date"></div>
<div class="filter-group"><label for="filter-to">Hasta:</label><input id="filter-to" type="date"></div>
<button id="refresh" type="button" class="outline-button">Actualizar</button></div>
<div class="history-scroll"><table><thead><tr><th>Fecha / Hora</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Referencia</th><th>Motivo</th><th>Registrado por</th></tr></thead><tbody id="movements"></tbody></table></div>
<div id="pagination" class="sales-pagination" style="display:none"></div></section>
</section></main></div>
<dialog id="movement-dialog" aria-labelledby="movement-title"><header class="dialog-heading"><h2 id="movement-title">Detalle del movimiento</h2><button type="button" data-close="movement-dialog" aria-label="Cerrar">×</button></header><div id="movement-content"></div><footer class="dialog-actions"><button type="button" data-close="movement-dialog">Cerrar</button></footer></dialog>
<dialog id="stock-loss-dialog" aria-labelledby="stock-loss-title"><form id="stock-loss-form"><header class="dialog-heading"><h2 id="stock-loss-title">Registrar merma o salida</h2><button type="button" data-close="stock-loss-dialog" aria-label="Cerrar">×</button></header><div class="form-grid"><label class="full">Producto<select name="productId" required></select></label><label>Tipo<select name="type"><option value="DANO">Daño o merma</option><option value="SALIDA">Otra salida</option></select></label><label>Unidades<input name="quantity" type="number" min="1" step="1" required></label><label class="full">Motivo<input name="notes" maxlength="500" required minlength="3" placeholder="Ej.: envase roto, caducado…"></label></div><p id="stock-loss-error" role="alert"></p><footer class="dialog-actions"><button type="button" data-close="stock-loss-dialog">Cancelar</button><button class="primary">Guardar movimiento</button></footer></form></dialog>
</body></html>
