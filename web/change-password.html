<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña · Trainers Point</title>
  <link rel="stylesheet" href="fichajes.css">
  <link rel="stylesheet" href="gestion.css">
  <link rel="stylesheet" href="design.css">
  <script src="change-password.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <span class="tp-wordmark" role="img" aria-label="Trainers Point"><b class="tp-initial">T.</b><span class="tp-name">trainers<span>point</span></span></span>
    <h1>Cambia tu contraseña</h1>
    <p class="hint">Por seguridad, debes elegir una contraseña personal antes de continuar.</p>
    <form id="password-form">
      <div class="form-grid">
        <label>Contraseña actual<input type="password" id="current-password" autocomplete="current-password" required maxlength="128"></label>
        <label>Nueva contraseña<input type="password" id="new-password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
        <label>Repite la nueva contraseña<input type="password" id="confirm-password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
      </div>
      <p class="hint">Usa al menos 12 caracteres y no reutilices la contraseña temporal.</p>
      <p id="password-error" class="warning" role="alert" hidden></p>
      <button class="primary" id="password-submit">Guardar contraseña</button>
    </form>
  </main>
</body>
</html>
