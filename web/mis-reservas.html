<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis reservas</title><link rel="stylesheet" href="fichajes.css"><link rel="stylesheet" href="gestion.css"><link rel="stylesheet" href="menu.css"><link rel="stylesheet" href="design.css"><script src="runtime.js" defer></script><script src="menu.js" defer></script><script src="mis-reservas.js" defer></script><body><aside data-app-menu></aside><main class="attendance-shell"><h1>Mis reservas</h1><p id="notice" role="status"></p><section class="attendance-card"><h2>Reservar una sesión</h2><form id="reserve" class="form-grid"><label>Servicio<select id="service" required></select></label><p id="price"></p><label>Entrenador<select id="employee" required></select></label><label>Sala<select id="room" required></select></label><label>Fecha<input type="date" id="date" required></label><label>Horas disponibles<select id="slot" required></select></label><label id="credit-wrap" hidden><input type="checkbox" id="credit"> Utilizar una sesión pendiente sin nuevo cobro</label><button id="submit">Confirmar reserva</button></form></section><section class="attendance-card"><h2>Mis sesiones pendientes</h2><div id="credits"></div></section><section class="attendance-card"><h2>Mi calendario de reservas</h2><div id="bookings"></div></section></main></body></html>
